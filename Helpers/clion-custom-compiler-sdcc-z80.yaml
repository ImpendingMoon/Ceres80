compilers:
  - description: SDCC for Z80 on Linux
    match-compiler-exe: "(/usr/bin/)?sdcc"
    match-args: -mz80
    match-language: C
    include-dirs:
      - /usr/bin/../share/sdcc/include/z80
      - /usr/share/sdcc/include/z80
      - /usr/bin/../share/sdcc/include
      - /usr/share/sdcc/include
    defines-text: "
#define _AUTOMEM 
#define __SDCC_BITINT_MAXWIDTH 64
#define __SDCC_NONBANKED 
#define __SIZE_T_DEFINED 
#define va_start(marker,last) { marker = (va_list)&last + sizeof(last); }
#define __SDCC_ASM_Z80_FEATURES_H 1
#define va_copy(dest,src) { dest = src; }
#define __SDCC_SDCC_LIB_H 1
#define NULL (void *)0
#define __STDC_VERSION__ 201112L
#define __SDCC_INT_LONG_REENT 1
#define __STDC_HOSTED__ 1
#define __SDCCCALL 1
#define __STDC_UTF_16__ 1
#define __SIZEOF_FLOAT__ 4
#define __SDCC_VERSION_MINOR 4
#define __SDCC_z80 1
#define __STDC_ISO_10646__ 201409L
#define __SDCC_VERSION_PATCH 0
#define __SDCC_FLOAT_REENT 1
#define _REENTRANT 
#define __SDCC_VERSION_MAJOR 4
#define EOF (-1)
#define __STDC_NO_VLA__ 1
#define __STDC_VERSION_STDARG_H__ 201710L
#define __SDCC 4_4_0
#define va_arg(marker,type) *((type *)((marker += sizeof(type)) - sizeof(type)))
#define __STDC_UTF_32__ 1
#define __STDC_NO_THREADS__ 1
#define _CODE 
#define __SDCC_CHAR_UNSIGNED 1
#define _STATMEM 
#define _SDCC_MANGLES_SUPPORT_FUNS 1
#define __STDC_NO_ATOMICS__ 1
#define __SIZEOF_DOUBLE__ 4
#define __SDCC_STACK_AUTO 1
#define va_end(marker) { marker = (va_list) 0; };
#define __STDC__ 1
#define _SDCC_Z80_STYLE_LIB_OPT 1
#define __SDC51_STDIO_H 1
#define __SDCC_REVISION 14620
#define __STDC_NO_COMPLEX__ 1

#define __interrupt
#define __naked
#define __asm__(x)
#define __code
#define __sfr unsigned char
#define __at(x)
#define __sdcccall(x)
#define __critical
"
